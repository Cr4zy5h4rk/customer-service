apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhipster-kafka
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jhipster-kafka
  template:
    metadata:
      labels:
        app: jhipster-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka-native:4.3.1
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_ADVERTISED_LISTENERS
              value: 'PLAINTEXT://jhipster-kafka.default.svc.cluster.local:9092'
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          ports:
            - containerPort: 9092
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '1Gi'
              cpu: '1'
---
apiVersion: v1
kind: Service
metadata:
  name: jhipster-kafka
  namespace: default
spec:
  selector:
    app: jhipster-kafka
  ports:
    - port: 9092
